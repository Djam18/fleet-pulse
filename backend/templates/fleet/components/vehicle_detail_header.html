{% load i18n %}
<div class="mb-4">
    <a href="{% url 'fleet:vehicle_list' %}" class="btn btn-sm btn-outline-secondary rounded-pill px-3 mb-2">
        <i class="bi bi-arrow-left"></i> {% trans "Back to Directory" %}
    </a>
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div>
            <h1 class="h2 fw-bold font-monospace mb-1">{{ vehicle.license_plate }}</h1>
            <div class="text-muted">{{ vehicle.make }} {{ vehicle.model }} ({{ vehicle.year }}) &bull; VIN: <span class="font-monospace">{{ vehicle.vin }}</span></div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-light text-dark border p-2 fs-6 rounded-pill">{{ vehicle.get_status_display }}</span>
            <a href="{% url 'admin:fleet_vehicle_change' vehicle.id %}" class="btn btn-dark rounded-pill px-3" target="_blank">
                <i class="bi bi-pencil-square me-1"></i> {% trans "Edit in Admin" %}
            </a>
        </div>
    </div>
</div>
