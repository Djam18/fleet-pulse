{% load i18n %}
<div class="modal fade" id="quickTripModal" tabindex="-1" aria-labelledby="quickTripModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 pb-0">
                <div>
                    <h5 class="modal-title fw-bold text-dark" id="quickTripModalLabel">
                        <i class="bi bi-geo-alt-fill text-primary me-2"></i>{% trans "Enregistrement Rapide de Trajet" %}
                    </h5>
                    <p class="text-muted small mb-0">{% trans "Consigner une mission commerciale ou navette" %}</p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form action="{% url 'fleet:quick_trip_create' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.get_full_path }}">
                <div class="modal-body py-3">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-slate-700">{% trans "Immatriculation du véhicule" %}</label>
                        {% if vehicle %}
                            <input type="text" name="license_plate" class="form-control form-control-sm bg-light fw-bold" value="{{ vehicle.license_plate }}" readonly>
                        {% else %}
                            <input type="text" name="license_plate" class="form-control form-control-sm" placeholder="Ex: FL-100-AA" required>
                        {% endif %}
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-slate-700">{% trans "Distance parcourue (km)" %}</label>
                        <input type="number" name="distance_km" min="1" max="2000" class="form-control form-control-sm" value="45" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-slate-700">{% trans "Objet / Mission" %}</label>
                        <input type="text" name="purpose" class="form-control form-control-sm" placeholder="{% trans 'Ex: Livraison express client nord' %}" value="Commercial transit run" required>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-sm btn-light border px-3" data-bs-dismiss="modal">{% trans "Annuler" %}</button>
                    <button type="submit" class="btn btn-sm btn-primary fw-semibold px-3">
                        <i class="bi bi-check2-circle me-1"></i>{% trans "Enregistrer Trajet" %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
