{% if messages %}
<div class="position-fixed top-0 end-0 p-3" style="z-index: 1080; max-width: 420px;" x-data="{ show: true }">
    {% for message in messages %}
        <div class="toast show align-items-center border-0 shadow-lg mb-2 rounded-3 text-white
            {% if message.tags == 'error' or message.tags == 'danger' %}bg-danger
            {% elif message.tags == 'warning' %}bg-warning text-dark
            {% elif message.tags == 'success' %}bg-success
            {% else %}bg-primary{% endif %}"
             role="alert" aria-live="assertive" aria-atomic="true"
             x-data="{ visible: true }" x-show="visible"
             x-init="setTimeout(() => visible = false, 5000)">
            <div class="d-flex p-2 align-items-center">
                <div class="toast-body d-flex align-items-center gap-2 py-1 px-2 small fw-medium">
                    {% if message.tags == 'error' or message.tags == 'danger' %}
                        <i class="bi bi-x-octagon-fill fs-5"></i>
                    {% elif message.tags == 'warning' %}
                        <i class="bi bi-exclamation-triangle-fill fs-5 text-dark"></i>
                    {% elif message.tags == 'success' %}
                        <i class="bi bi-check-circle-fill fs-5"></i>
                    {% else %}
                        <i class="bi bi-info-circle-fill fs-5"></i>
                    {% endif %}
                    <span>{{ message }}</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" @click="visible = false" aria-label="Close"></button>
            </div>
        </div>
    {% endfor %}
</div>
{% endif %}
