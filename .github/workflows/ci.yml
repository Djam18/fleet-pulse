name: FleetPulse Backend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Django 4.2 LTS Test Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      SECRET_KEY: "ci-secret-key-not-for-production-use"
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "sqlite:///db.sqlite3"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Run Django System Checks
        working-directory: ./backend
        run: |
          python manage.py check

      - name: Run Django Database Migrations Check
        working-directory: ./backend
        run: |
          python manage.py migrate --no-input

      - name: Run Unit Tests with Deprecation Warnings (-Wd)
        working-directory: ./backend
        run: |
          python -Wd manage.py test fleet --no-input
